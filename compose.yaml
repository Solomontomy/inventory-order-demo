services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["demo-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d inventory_demo"]
      interval: 5s
      retries: 10
volumes:
  demo-data:
